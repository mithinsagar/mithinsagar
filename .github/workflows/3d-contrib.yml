name: GitHub-Profile-3D-Contrib

on:
  # Scheduled runs disabled — this was pushing a commit to this repo every
  # day on its own. Trigger it by hand from the Actions tab when you actually
  # want an updated graph.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: mithinsagar
      - run: |
          git config user.email "mithinsagar@gmail.com"
          git config user.name "mithinsagar"
          git add -A .
          git commit -m "3d contrib graph update"
          git push
