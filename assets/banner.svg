<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Mithin Sagar — AI and Machine Learning, Software Engineering, Interface Design">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="55%" stop-color="#101728"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#22D3EE" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#FFFFFF" stroke-opacity="0.028" stroke-width="1"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A0F1D" stop-opacity="1"/>
      <stop offset="52%" stop-color="#0A0F1D" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0A0F1D" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- base -->
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse cx="985" cy="150" rx="360" ry="260" fill="url(#glow)"/>
  <ellipse cx="1150" cy="290" rx="260" ry="200" fill="url(#glow2)"/>

  <!-- network motif -->
  <g stroke="#7DD3FC" stroke-opacity="0.30" stroke-width="1">
    <path d="M900 78 L1000 132 L960 214 L866 196 L900 78 Z" fill="none"/>
    <path d="M1000 132 L1104 96"/>
    <path d="M1000 132 L1112 190"/>
    <path d="M960 214 L1052 258"/>
    <path d="M866 196 L820 262"/>
    <path d="M900 78 L826 46"/>
    <path d="M1112 190 L1052 258"/>
    <path d="M1104 96 L1112 190"/>
    <path d="M866 196 L1000 132"/>
  </g>
  <g fill="#E0F2FE">
    <circle cx="900"  cy="78"  r="4.5" opacity="0.95"/>
    <circle cx="1000" cy="132" r="6"   opacity="1"/>
    <circle cx="960"  cy="214" r="4.5" opacity="0.9"/>
    <circle cx="866"  cy="196" r="4"   opacity="0.8"/>
    <circle cx="1104" cy="96"  r="3.5" opacity="0.7"/>
    <circle cx="1112" cy="190" r="4"   opacity="0.75"/>
    <circle cx="1052" cy="258" r="3.5" opacity="0.6"/>
    <circle cx="826"  cy="46"  r="3"   opacity="0.5"/>
    <circle cx="820"  cy="262" r="3"   opacity="0.45"/>
  </g>
  <circle cx="1000" cy="132" r="15" fill="none" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1"/>
  <circle cx="1000" cy="132" r="28" fill="none" stroke="#6366F1" stroke-opacity="0.18" stroke-width="1"/>

  <!-- left fade so text always sits on clean ground -->
  <rect width="820" height="320" fill="url(#fade)"/>

  <!-- type -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="64" y="122" fill="#F8FAFC" font-size="60" font-weight="700" letter-spacing="1.5">Mithin Sagar</text>
    <rect x="66" y="146" width="96" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="64" y="192" fill="#B6C2D9" font-size="20" font-weight="500" letter-spacing="0.4">AI &amp; Machine Learning &#160;·&#160; Software Engineering &#160;·&#160; Interface Design</text>
    <text x="64" y="224" fill="#64748B" font-size="15" font-weight="400" letter-spacing="0.3">B.Tech Computer Science (AI &amp; ML), VIT Chennai &#160;·&#160; Chennai, India</text>
    <text x="65" y="268" fill="#8FA6C4" font-size="12.5" font-weight="600" letter-spacing="2.2">ML INTERN @ IGCAR &#160;&#160;/&#160;&#160; ICANDIT 2026 AUTHOR &#160;&#160;/&#160;&#160; HACK THE GAP WINNER</text>
  </g>

  <rect x="0" y="317" width="1200" height="3" fill="url(#accent)" opacity="0.85"/>
</svg>
